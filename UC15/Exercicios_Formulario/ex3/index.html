<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario 3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="formulario">
      <div class="cabecalho">
        <h1>Vale-Presentes</h1>
        <h2>
          Este vale presente será enviado para o destinatário após o seu pedido
          ter sido pago
        </h2>
      </div>

      <form action="" method="post">




        <div class="campo">
          <label class="titulo">Seu Nome: </label>
          <div class="campos_nome">
            <div class="grupo-nome">
              <input type="text" name="nome" id="nome" size="10" required />
              <label for="nome">Nome</label>
            </div>
            <div class="grupo-nome">
              <input type="text" name="sobrenome" id="sobrenome" size="25" required />
              <label for="sobrenome">Sobrenome</label>
            </div>
          </div>
        </div>

        <div class="campo">
        <label for="email" class="titulo"> Seu E-mail:</label>
          <div>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="ex: myname@example.com"
              size="50"
            />
          </div>
        </div>
    
            <div class="campo">
          <label class="titulo">Nome do destinatário: </label>
          <div class="campos_nome">
            <div class="grupo-nome">
              <input type="text" name="nome_destinatario" id="nome_destinatario" size="10" required />
              <label for="nome_destinatario">Nome</label>
            </div>
            <div class="grupo-nome">
              <input type="text" name="sobrenome_destinatario" id="sobrenome_destinatario" size="25" required />
              <label for="sobrenome_destinatario">Sobrenome</label>
            </div>
          </div>
        </div>

        <div class="campo">
        <label for="email_destinatario" class="titulo"> E-mail do destinatario:</label>
          <div>
            <input
              type="email"
              name="email_destinatario"
              id="email_destinatario"
              placeholder="ex: myname@example.com"
              size="50"
            />
          </div>
        </div>

        <div class="campo">
            <label class="titulo">Endereço do destinatário:</label>
            <div class="campos_endereco">
            <div class="grupo-nome" >
              <input type="text" name="nome" id="nome"   required  class="endereco_item" />
              <label for="nome">Nome</label>
            </div>
            <div class="grupo-nome" >
              <input type="text" name="sobrenome" id="sobrenome"  required class="endereco_item" />
              <label for="sobrenome">Sobrenome</label>
            </div>

            <div class="campos_nome">
            <div class="grupo-nome">
              <input type="text" name="nome" id="nome" size="10" required />
              <label for="nome">Nome</label>
            </div>
            <div class="grupo-nome">
              <input type="text" name="sobrenome" id="sobrenome" size="25" required />
              <label for="sobrenome">Sobrenome</label>
            </div>
          </div>
          <div class="campos_nome">
            <div class="grupo-nome">
              <input type="text" name="nome" id="nome" size="10" required />
              <label for="nome">Nome</label>
            </div>
            <div class="grupo-nome">
              <select name="" id="">
                <option value=""></option>
                <option value=""></option>
                <option value=""></option>
                <option value=""></option>
              </select>
              <label for="sobrenome">Sobrenome</label>
            </div>
          </div>


         </div>


        </div>



      </form>
    </div>
  </body>
</html>
