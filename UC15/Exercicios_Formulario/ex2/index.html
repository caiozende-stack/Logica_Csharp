<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="formulario">
      <form action="" method="post">
        <div class="campo">
          <label for="nome">Nome Completo: </label>
          <input type="text" id="nome" name="nome" size="40" required />
        </div>

        <div class="campo">
          <label for="email">E-mail: </label>
          <input
            type="email"
            name="email"
            id="email"
            size="40"
            required
          />
        </div>

        <div class="campo">
          <label for="endereco">Endereço: </label>
          <input
            type="text"
            id="endereco"
            name="endereco"
          />
        </div>
        <div class="campo">
          <label for="bairro">Bairro:</label>
          <input
            type="text"
            id="bairro"
            name="bairro"
            
          />
        </div>
        <div class="campo">
          <label for="cidade">Cidade:</label>
          <input
            type="text"
            id="cidade"
            name="cidade"
          />
        </div>

        <div class="campo">
          <label for="telefone">Telefone fixo ou celular: </label>
          <input
            type="tel"
            name="telefone"
            id="telefone"
            placeholder="(##) #####-####"
            size="10"
            required
          />
        </div>

        <div class="campo">
            <label class="titulo-campo">Serviços em couro :</label>
            <div class="lista_opcao">
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="legitimo"> Banco em couro - 100% legitimo
                </label>
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="misto">Banco em couro - Misto
                </label>
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="sintetico"> Banco em couro - 100% Sintético
                </label>
                  <label class="opcao">
                    <input type="checkbox" name="servicos" value="volante"> Volante em couro
                </label>
                  <label class="opcao">
                    <input type="checkbox" name="servicos" value="manopla"> Revestimento da manopla e coifa
                </label>
                  <label class="opcao">
                    <input type="checkbox" name="servicos" value="apoio"> Revestimento do apoio de braço
                </label>
            </div>
          </div>


           <div class="campo">
            <label class="titulo-campo">Restauração e tapeçaria:</label>
            <div class="lista_opcao">
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="completa"> Restauração completa de carros antigos
                </label>
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="teto">Somente troca do teto
                </label>
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="assoalho"> Somente troca do assoalho
                </label>
                  <label class="opcao">
                    <input type="checkbox" name="servicos" value="reparo"> Reparo em estrutura dos bancos e ferragens
                </label>
                  <label class="opcao">
                    <input type="checkbox" name="servicos" value="manopla"> Hidratação e higienização dos bancos
                </label>
            </div>
          </div>


           <div class="campo">
            <label class="titulo-campo">Acessorios :</label>
            <div class="lista_opcao">
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="hidratacao"> kit Hidratação p/ Couro
                </label>
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="tapetes">
                    Tapates personalizados
                </label>
                <label class="opcao">
                    <input type="checkbox" name="servicos" value="adaptacao">
                    Adaptação de apoio de braço
                </label>
            </div>
          </div>

    







      </form>
    </div>
  </body>
</html>
