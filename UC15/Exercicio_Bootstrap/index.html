<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cabecalho d-flex flex-column">
      <div class="container-fluid text-center padding-menu">
        <div class="row">
          <div class="col-4 d-flex justify-content-start">
            <img src="./img/logo.png" alt="" class="logo" />
          </div>

          <div class="col-8 align-self-end d-flex justify-content-end">
            <ul class="nav bg-transparent gap-4">
              <li class="nav-item">
                <a
                  class="nav-link fg-white fw-bold fs-2xl border"
                  aria-current="page"
                  href="#"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link fg-white fw-bold fs-2xl border" href="#"
                  >Passeios</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link fg-white fw-bold fs-2xl border" href="#"
                  >Preços
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link fg-white fw-bold fs-2xl border" href="#"
                  >Contato</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="container-fluid mt-auto text-center padding-grande">
        <h1 class="fg-white padding-grande fw-bold">
          AVENTURA E TRANQUILIDADE
        </h1>
        <div class="container w-50">
          <div class="row gap-4">
            <div class="col d-flex justify-content-end">
              <button
                type="button"
                class="btn-outline theme-inverse fg-white fs-xl fw-bold border border-5 btn-1"
              >
                VIDEO
              </button>
            </div>
            <div class="col d-flex justify-content-start">
              <button
                type="button"
                class="btn-outline theme-inverse fg-white fs-xl fw-bold border border-5 btn-1"
              >
                LEIA MAIS
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="area-passeio">
      <h3 class="p-10 fw-bold">Passeios</h3>
      <div class="container-fluid text-center">
        <div class="row align-items-center">
          <div class="col d-flex justify-content-center">
            <div class="card" style="width: 30rem">
              <div class="card-body">
                <img src="./img/img1.png" class="card-img" alt="..." />
                <h3 class="mt-2 mb-0">Canoagem</h3>
              </div>
            </div>
          </div>
          <div class="col d-flex justify-content-center">
            <div class="card" style="width: 30rem">
              <div class="card-body">
                <img src="./img/img2.png" class="card-img" alt="..." />
                <h3 class="mt-2 mb-0">Passeio radical</h3>
              </div>
            </div>
          </div>
          <div class="col d-flex justify-content-center">
            <div class="card" style="width: 30rem">
              <div class="card-body">
                <img src="./img/img3.png" class="card-img" alt="..." />
                <h3 class="mt-2 mb-0">Trilhas</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="area-valores">
      <h3 class="fg-black fw-bold p-10">Valores</h3>
      <div class="container-fluid d-flex justify-content-center ">
        <table class="table table-bordered text-center ">
          <thead>
            <tr>
              <th scope="col">Passeios</th>
              <th scope="col">Valores</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Canoagem</td>
              <td>R$60,00</td>
            </tr>
            <tr>
              <td>Canoagem</td>
              <td>R$60,00</td>
            </tr>
            <tr>
              <td>Canoagem</td>
              <td>R$60,00</td>
            </tr>
            <tr>
              <th scope="col" colspan="2" class="py-5">
                Consulte na Recepção os valores atualizados
              </th>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
